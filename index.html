<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Protótipo frontend do sistema de agendamento da Clínica de Fisioterapia.">
    <title>Clínica - Fisioterapia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="toastArea" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <div id="loginScreen" class="login-screen">
        <div class="login-card shadow-lg">

            <div class="brand-mark">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>

            <h1>Clínica - Fisioterapia</h1>
            <p class="text-muted mb-4">Clínica de Fisioterapia</p>

            <div class="mb-3 text-start">
                <label class="form-label">E-mail</label>
                <input
                    id="loginEmail"
                    class="form-control form-control-lg"
                    type="email"
                    value="admin@joelmafisioterapia.com"
                    placeholder="seu@email.com"
                >
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">Senha</label>
                <input
                    id="loginPassword"
                    class="form-control form-control-lg"
                    type="password"
                    value="123456"
                    placeholder="••••••••"
                >
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">Acessar como</label>

                <select id="loginRole" class="form-select form-select-lg">
                    <option value="admin">Funcionária / Administradora</option>
                    <option value="user">Paciente</option>
                </select>
            </div>

            <button
                class="btn btn-primary btn-lg w-100"
                onclick="login()"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Entrar no sistema
            </button>

            <small class="d-block text-muted mt-3">
                Protótipo frontend — dados salvos somente no navegador.
            </small>

        </div>
    </div>

    <div id="app" class="d-none">

        <aside id="sidebar" class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-mark small">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>

                <div>
                    <strong>Clínica</strong>
                    <small>Fisioterapia</small>
                </div>
            </div>

            <div class="profile-box">
                <div class="avatar" id="profileAvatar">JN</div>

                <div>
                    <strong id="profileName">Joelma</strong>
                    <small id="profileRole">Administradora</small>
                </div>
            </div>

            <nav id="adminMenu" class="menu-list">

                <button class="menu-link active" data-page="dashboard">
                    <i class="bi bi-grid-1x2-fill"></i>
                    Dashboard
                </button>

                <button class="menu-link" data-page="agenda">
                    <i class="bi bi-calendar3"></i>
                    Agenda e consultas
                </button>

                <button class="menu-link" data-page="pacientes">
                    <i class="bi bi-people-fill"></i>
                    Pacientes
                </button>

                <button class="menu-link" data-page="avaliacoes">
                    <i class="bi bi-clipboard2-pulse-fill"></i>
                    Avaliações físicas
                </button>

                <button class="menu-link" data-page="pagamentos">
                    <i class="bi bi-cash-coin"></i>
                    Pagamentos
                </button>

                <button class="menu-link" data-page="relatorios">
                    <i class="bi bi-bar-chart-fill"></i>
                    Relatórios
                </button>

            </nav>

            <nav id="userMenu" class="menu-list d-none">

                <button class="menu-link active" data-page="meu-dashboard">
                    <i class="bi bi-house-heart-fill"></i>
                    Minha área
                </button>

                <button class="menu-link" data-page="minhas-consultas">
                    <i class="bi bi-calendar-check-fill"></i>
                    Minhas consultas
                </button>

                <button class="menu-link" data-page="minhas-avaliacoes">
                    <i class="bi bi-file-medical-fill"></i>
                    Minhas avaliações
                </button>

                <button class="menu-link" data-page="meus-pagamentos">
                    <i class="bi bi-receipt"></i>
                    Meus pagamentos
                </button>

            </nav>

            <div class="sidebar-footer">
                <button class="menu-link" onclick="logout()">
                    <i class="bi bi-box-arrow-left"></i>
                    Sair
                </button>
            </div>

        </aside>

        <main class="main-content">

            <header class="topbar">

                <button
                    class="btn btn-light d-lg-none"
                    onclick="toggleSidebar()"
                >
                    <i class="bi bi-list fs-4"></i>
                </button>

                <div>
                    <span class="text-muted" id="breadcrumb">
                        Visão geral
                    </span>

                    <h2 id="pageTitle" class="mb-0">
                        Dashboard
                    </h2>
                </div>

                <div class="top-actions">

                    <span class="date-pill">
                        <i class="bi bi-calendar3 me-2"></i>
                        <span id="todayDate"></span>
                    </span>

                    <button
                        class="btn btn-light"
                        onclick="toggleTheme()"
                        title="Alternar tema"
                    >
                        <i class="bi bi-moon-stars"></i>
                    </button>

                </div>

            </header>

            <section id="pageContent" class="page-content"></section>

        </main>

    </div>

    <div class="modal fade" id="appointmentModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="bi bi-calendar-plus me-2"></i>
                        Nova consulta
                    </h5>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <form id="appointmentForm" class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Paciente
                            </label>

                            <input
                                id="appointmentPatient"
                                class="form-control"
                                type="text"
                                placeholder="Digite seu nome completo"
                                required
                            >

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Tipo de atendimento
                            </label>

                            <select
                                id="appointmentType"
                                class="form-select"
                            >
                                <option>Fisioterapia</option>
                                <option>Avaliação inicial</option>
                                <option>Retorno</option>
                                <option>Pilates terapêutico</option>
                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Data
                            </label>

                            <input
                                id="appointmentDate"
                                class="form-control"
                                type="date"
                                required
                            >

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Horário
                            </label>

                            <input
                                id="appointmentTime"
                                class="form-control"
                                type="time"
                                required
                            >

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Observação
                            </label>

                            <textarea
                                id="appointmentNote"
                                class="form-control"
                                rows="3"
                                placeholder="Ex.: foco em mobilidade e fortalecimento..."
                            ></textarea>

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-light"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        class="btn btn-primary"
                        onclick="saveAppointment()"
                    >
                        Salvar consulta
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="modal fade" id="assessmentModal" tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="bi bi-clipboard2-pulse me-2"></i>
                        Registrar avaliação física
                    </h5>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <form id="assessmentForm" class="row g-4">

                        <div class="col-md-5">

                            <label class="form-label">
                                Paciente
                            </label>

                            <select
                                id="assessmentPatient"
                                class="form-select mb-3"
                                required
                            ></select>

                            <div class="row g-2">

                                <div class="col-6">

                                    <label class="form-label">
                                        Peso (kg)
                                    </label>

                                    <input
                                        id="weight"
                                        type="number"
                                        step="0.1"
                                        class="form-control"
                                    >

                                </div>

                                <div class="col-6">

                                    <label class="form-label">
                                        Altura (cm)
                                    </label>

                                    <input
                                        id="height"
                                        type="number"
                                        class="form-control"
                                    >

                                </div>

                                <div class="col-6">

                                    <label class="form-label">
                                        Dor (0–10)
                                    </label>

                                    <input
                                        id="pain"
                                        type="number"
                                        min="0"
                                        max="10"
                                        class="form-control"
                                    >

                                </div>

                                <div class="col-6">

                                    <label class="form-label">
                                        Mobilidade
                                    </label>

                                    <select
                                        id="mobility"
                                        class="form-select"
                                    >
                                        <option>Boa</option>
                                        <option>Regular</option>
                                        <option>Reduzida</option>
                                    </select>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-7">

                            <label class="form-label">
                                Observações para o paciente
                            </label>

                            <textarea
                                id="assessmentNote"
                                class="form-control mb-3"
                                rows="4"
                                placeholder="Evolução, orientações e recomendações..."
                            ></textarea>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Foto do antes
                                    </label>

                                    <input
                                        id="beforePhoto"
                                        type="file"
                                        accept="image/*"
                                        class="form-control"
                                        onchange="previewImage(this,'beforePreview')"
                                    >

                                    <div
                                        id="beforePreview"
                                        class="photo-preview mt-2"
                                    >
                                        <i class="bi bi-image"></i>
                                        <span>Pré-visualização</span>
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Foto do depois
                                    </label>

                                    <input
                                        id="afterPhoto"
                                        type="file"
                                        accept="image/*"
                                        class="form-control"
                                        onchange="previewImage(this,'afterPreview')"
                                    >

                                    <div
                                        id="afterPreview"
                                        class="photo-preview mt-2"
                                    >
                                        <i class="bi bi-image"></i>
                                        <span>Pré-visualização</span>
                                    </div>

                                </div>

                            </div>

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-light"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        class="btn btn-primary"
                        onclick="saveAssessment()"
                    >
                        Salvar avaliação
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
